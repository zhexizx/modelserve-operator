# This rule is not used by the project modelserve-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over serving.zhexi.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: modelserve-operator
    app.kubernetes.io/managed-by: kustomize
  name: modeldeployment-admin-role
rules:
- apiGroups:
  - serving.zhexi.dev
  resources:
  - modeldeployments
  verbs:
  - '*'
- apiGroups:
  - serving.zhexi.dev
  resources:
  - modeldeployments/status
  verbs:
  - get
